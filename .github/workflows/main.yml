# This is a basic workflow to help you get started with Actions

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - "**"
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      mixxx_ref:
        description: 'Mixxx tag or branch to build'
        required: false
        default: '2.5.6'
        type: string
      build_image:
        description: 'Also produce a flashable Raspberry Pi image'
        required: false
        default: false
        type: boolean

jobs:
  # build_self_hosted:
  #   runs-on: self-hosted
  #   steps:
